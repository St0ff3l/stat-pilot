name: Build and release installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            runtime_bootstrap: unix
            builder_args: --mac dmg --arm64
            artifact_name: installers-macos-arm64
            artifact_path: release/*.dmg
          - name: macOS x64
            os: macos-15-intel
            runtime_bootstrap: unix
            builder_args: --mac dmg --x64
            artifact_name: installers-macos-x64
            artifact_path: release/*.dmg
          - name: Windows x64
            os: windows-2022
            runtime_bootstrap: windows
            builder_args: --win nsis --x64
            artifact_name: installers-windows-x64
            artifact_path: release/*.exe
          - name: Linux x64 deb
            os: ubuntu-22.04
            runtime_bootstrap: unix
            builder_args: --linux deb --x64
            artifact_name: installers-linux-x64-deb
            artifact_path: release/*.deb

    env:
      HERMES_COMMIT: ${{ vars.HERMES_COMMIT }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Bootstrap Hermes Runtime on macOS/Linux
        if: matrix.runtime_bootstrap == 'unix'
        run: npm run hermes:bootstrap:skip-setup

      - name: Bootstrap Hermes Runtime on Windows
        if: matrix.runtime_bootstrap == 'windows'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-hermes.ps1

      - name: Build renderer and server bundles
        run: npm run build

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p "require('./package.json').version")"
          if [ "$expected" != "$actual" ]; then
            echo "Tag version $expected does not match package version $actual"
            exit 1
          fi

      - name: Package installer
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "SZ Gov Scope $RELEASE_TAG" \
              --generate-notes
          fi
